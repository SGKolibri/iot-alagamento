openapi: 3.1.0
info:
  title: Plataforma IoT Integrada · API REST
  version: 1.3.0
  summary: Esqueleto da API v1 (PRD, seção 7). As respostas são detalhadas nas trilhas T1 e T3.
  description: |
    Todas as listagens aceitam os mesmos parâmetros: `pagina`, `limite`, `ordenar` e filtros por
    campo (RF-APP-07). Erros seguem o esquema `Erro`. O papel mínimo de cada operação está em
    `x-papel-minimo`; a autorização por papel e o isolamento por inquilino entram na trilha T3.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3001/api/v1
    description: Central de desenvolvimento (HTTPS pelo Traefik na trilha T3)
security:
  - oidc: []
tags:
  - name: catalogo
  - name: dispositivos
  - name: ingestao
  - name: alarmes
  - name: integracao
  - name: dados-abertos
  - name: ngsi-ld

paths:
  /catalogo/dominios:
    post:
      tags: [catalogo]
      operationId: criarDominios
      summary: Criar dominios
      x-papel-minimo: gestor
      parameters:
        - $ref: '#/components/parameters/inquilino'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoDominio'
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dominio'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          $ref: '#/components/responses/Conflito'
    get:
      tags: [catalogo]
      operationId: listarDominios
      summary: Listar dominios do inquilino (ordenar por slug, nome, criado_em)
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
        - $ref: '#/components/parameters/ordenar'
      responses:
        '200':
          description: Página do inquilino.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDominios'
        '400':
          $ref: '#/components/responses/ErroValidacao'
  /catalogo/dominios/{id}:
    get:
      tags: [catalogo]
      operationId: obterDominios
      summary: Ler um item do inquilino
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dominio'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags: [catalogo]
      operationId: alterarDominios
      summary: Alterar um item do inquilino
      x-papel-minimo: gestor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoDominio'
      responses:
        '200':
          description: Item alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dominio'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /perfis:
    post:
      tags: [catalogo]
      operationId: criarPerfis
      summary: Criar perfis
      x-papel-minimo: gestor
      parameters:
        - $ref: '#/components/parameters/inquilino'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPerfil'
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          $ref: '#/components/responses/Conflito'
    get:
      tags: [catalogo]
      operationId: listarPerfis
      summary: Listar perfis do inquilino (ordenar por nome, versao, criado_em)
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
        - $ref: '#/components/parameters/ordenar'
      responses:
        '200':
          description: Página do inquilino.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPerfis'
        '400':
          $ref: '#/components/responses/ErroValidacao'
  /perfis/{id}:
    get:
      tags: [catalogo]
      operationId: obterPerfis
      summary: Ler um item do inquilino
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags: [catalogo]
      operationId: alterarPerfis
      summary: Alterar um item do inquilino
      x-papel-minimo: gestor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoPerfil'
      responses:
        '200':
          description: Item alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /sites:
    post:
      tags: [catalogo]
      operationId: criarSites
      summary: Criar sites
      x-papel-minimo: gestor
      parameters:
        - $ref: '#/components/parameters/inquilino'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoSite'
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          $ref: '#/components/responses/Conflito'
    get:
      tags: [catalogo]
      operationId: listarSites
      summary: Listar sites do inquilino (ordenar por slug, nome, criado_em)
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
        - $ref: '#/components/parameters/ordenar'
      responses:
        '200':
          description: Página do inquilino.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaSites'
        '400':
          $ref: '#/components/responses/ErroValidacao'
  /sites/{id}:
    get:
      tags: [catalogo]
      operationId: obterSites
      summary: Ler um item do inquilino
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags: [catalogo]
      operationId: alterarSites
      summary: Alterar um item do inquilino
      x-papel-minimo: gestor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoSite'
      responses:
        '200':
          description: Item alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /areas:
    post:
      tags: [catalogo]
      operationId: criarAreas
      summary: Criar areas
      x-papel-minimo: gestor
      parameters:
        - $ref: '#/components/parameters/inquilino'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaArea'
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          $ref: '#/components/responses/Conflito'
    get:
      tags: [catalogo]
      operationId: listarAreas
      summary: Listar areas do inquilino (ordenar por slug, nome, criado_em)
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
        - $ref: '#/components/parameters/ordenar'
      responses:
        '200':
          description: Página do inquilino.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAreas'
        '400':
          $ref: '#/components/responses/ErroValidacao'
  /areas/{id}:
    get:
      tags: [catalogo]
      operationId: obterAreas
      summary: Ler um item do inquilino
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags: [catalogo]
      operationId: alterarAreas
      summary: Alterar um item do inquilino
      x-papel-minimo: gestor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoArea'
      responses:
        '200':
          description: Item alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /dispositivos:
    post:
      tags: [dispositivos]
      operationId: criarDispositivos
      summary: Cadastrar dispositivo e obter a credencial, mostrada uma única vez
      x-papel-minimo: integrador
      parameters:
        - $ref: '#/components/parameters/inquilino'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoDispositivo'
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispositivoCadastrado'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          $ref: '#/components/responses/Conflito'
    get:
      tags: [dispositivos]
      operationId: listarDispositivos
      summary: Listar dispositivos do inquilino (ordenar por slug, estado, ultimo_contato_em, criado_em)
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
        - $ref: '#/components/parameters/ordenar'
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoDispositivo'
        - name: tag
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Página do inquilino.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDispositivos'
        '400':
          $ref: '#/components/responses/ErroValidacao'
  /dispositivos/{id}:
    get:
      tags: [dispositivos]
      operationId: obterDispositivos
      summary: Ler um item do inquilino
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags: [dispositivos]
      operationId: alterarDispositivos
      summary: Alterar um item do inquilino
      x-papel-minimo: gestor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoDispositivo'
      responses:
        '200':
          description: Item alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /sites/{id}/areas:
    get:
      tags: [catalogo]
      operationId: listarAreasDoSite
      summary: Listar áreas do site, com geometria
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
        - $ref: '#/components/parameters/ordenar'
      responses:
        '200':
          description: Página de áreas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAreas'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /areas/{id}/dispositivos:
    get:
      tags: [catalogo]
      operationId: listarDispositivosDaArea
      summary: Dispositivos cuja localização está dentro do polígono da área (ST_Covers, borda conta como dentro)
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
        - $ref: '#/components/parameters/ordenar'
      responses:
        '200':
          description: Página de dispositivos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDispositivos'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /dispositivos/{id}/credenciais/revogar:
    post:
      tags: [dispositivos]
      operationId: revogarCredencial
      summary: Revogar a credencial do dispositivo (RF-DIS-02)
      x-papel-minimo: gestor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Credencial revogada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /dispositivos/{id}/telemetria:
    get:
      tags: [dispositivos]
      operationId: obterSerieDispositivo
      summary: Série do dispositivo, bruta ou agregada por bucket (RF-DAD-01)
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/grandeza'
        - $ref: '#/components/parameters/de'
        - $ref: '#/components/parameters/ate'
        - $ref: '#/components/parameters/bucket'
      responses:
        '200':
          description: Pontos ordenados pelo horário da medição; com bucket, média, mínimo e máximo por intervalo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerieDispositivo'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /telemetria:
    get:
      tags: [dispositivos]
      operationId: obterSerieArea
      summary: Série de cada dispositivo dentro da área (ST_Covers), bruta ou por bucket
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - name: area
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/grandeza'
        - $ref: '#/components/parameters/de'
        - $ref: '#/components/parameters/ate'
        - $ref: '#/components/parameters/bucket'
      responses:
        '200':
          description: Uma série por dispositivo da área.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerieArea'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /dispositivos/{id}/ultimo-estado:
    get:
      tags: [dispositivos]
      operationId: obterUltimoEstado
      summary: Último valor de cada grandeza do dispositivo, sem consultar a série (RF-DAD-02)
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Último valor por grandeza e estado do dispositivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UltimoEstadoDispositivo'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /ultimo-estado:
    get:
      tags: [dispositivos]
      operationId: listarUltimoEstado
      summary: Último estado dos dispositivos do inquilino (ordenar por slug, estado, ultimo_contato_em)
      x-papel-minimo: leitor
      parameters:
        - $ref: '#/components/parameters/inquilino'
        - name: site
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: area
          in: query
          description: Dispositivos dentro do polígono da área (ST_Covers).
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: dominio
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoDispositivo'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
        - $ref: '#/components/parameters/ordenar'
      responses:
        '200':
          description: Página de dispositivos com o último valor de cada grandeza.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUltimoEstado'
        '400':
          $ref: '#/components/responses/ErroValidacao'
  /ingestao:
    post:
      tags: [ingestao]
      operationId: ingerirMensagem
      summary: Enviar uma mensagem canônica por HTTP
      x-papel-minimo: dispositivo ou chave de API
      security:
        - tokenDispositivo: []
        - chaveApi: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MensagemCanonica'
      responses:
        '202':
          description: Mensagem válida, aceita para processamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoMensagem'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /ingestao/lote:
    post:
      tags: [ingestao]
      operationId: ingerirLote
      summary: Enviar lote de mensagens, com resultado por mensagem
      x-papel-minimo: dispositivo, borda ou chave de API
      security:
        - tokenDispositivo: []
        - chaveApi: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lote'
      responses:
        '200':
          description: Lote processado; cada mensagem tem o seu resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoLote'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /dispositivos/{id}/gemeo/desejado:
    put:
      tags: [dispositivos]
      operationId: definirEstadoDesejado
      summary: Definir estado desejado (comando assíncrono, fase 2)
      x-papel-minimo: gestor
      x-fase: 2
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Estado desejado registrado; será entregue na reconexão.
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /regras:
    post:
      tags: [catalogo]
      operationId: criarRegra
      summary: Criar regra de processamento, central ou de borda
      x-papel-minimo: gestor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Regra criada.
        '400':
          $ref: '#/components/responses/ErroValidacao'

  /alarmes:
    get:
      tags: [alarmes]
      operationId: listarAlarmes
      summary: Listar alarmes por estado, severidade e área
      x-papel-minimo: leitor
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [ativo, reconhecido, resolvido]
        - name: severidade
          in: query
          schema:
            type: string
        - name: area
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
        - $ref: '#/components/parameters/ordenar'
      responses:
        '200':
          description: Página de alarmes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaGenerica'

  /alarmes/{id}/reconhecer:
    patch:
      tags: [alarmes]
      operationId: reconhecerAlarme
      summary: Reconhecer um alarme
      x-papel-minimo: operador
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nota:
                  type: string
      responses:
        '200':
          description: Alarme reconhecido.
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'

  /validador:
    post:
      tags: [integracao]
      operationId: validarMensagem
      summary: Validar uma mensagem no sandbox, sem gravar
      x-papel-minimo: integrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Qualquer JSON; o validador responde com os erros por campo.
      responses:
        '200':
          description: Resultado da validação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoValidacao'

  /dados-abertos/{conjunto}:
    get:
      tags: [dados-abertos]
      operationId: obterDadosAbertos
      summary: Conjuntos anonimizados
      x-papel-minimo: público
      security: []
      parameters:
        - name: conjunto
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
        - $ref: '#/components/parameters/ordenar'
      responses:
        '200':
          description: Página do conjunto anonimizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaGenerica'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /ngsi-ld/v1/entities:
    get:
      tags: [ngsi-ld]
      operationId: listarEntidadesNgsiLd
      summary: Contexto NGSI-LD (fase 2)
      x-papel-minimo: leitor
      x-fase: 2
      responses:
        '200':
          description: Entidades NGSI-LD.
          content:
            application/ld+json:
              schema:
                type: array
                items:
                  type: object

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      description: Token bearer emitido pelo Keycloak (realm iot).
      openIdConnectUrl: http://localhost:8080/realms/iot/.well-known/openid-configuration
    tokenDispositivo:
      type: http
      scheme: bearer
      description: Credencial do dispositivo ou do nó de borda, emitida no cadastro (RF-DIS-02).
    chaveApi:
      type: apiKey
      in: header
      name: X-API-Key
      description: Chave de API com escopo e validade (RF-SEG-06).

  parameters:
    grandeza:
      name: grandeza
      in: query
      schema:
        type: string
    de:
      name: de
      in: query
      description: Início do intervalo, em UTC (padrão, 24 h antes de ate).
      schema:
        type: string
        format: date-time
    ate:
      name: ate
      in: query
      description: Fim do intervalo, em UTC (padrão, agora).
      schema:
        type: string
        format: date-time
    bucket:
      name: bucket
      in: query
      description: Intervalo de agregação; sem bucket, pontos brutos. Até 50.000 pontos por resposta (codigo pontos_demais).
      schema:
        type: string
        enum: ['1m', '15m', '1h']
    inquilino:
      name: X-Tenant
      in: header
      required: true
      description: Slug do inquilino. Provisório até a T3, quando o inquilino vem da claim do token (ADR-014).
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    pagina:
      name: pagina
      in: query
      description: Número da página, a partir de 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    limite:
      name: limite
      in: query
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    ordenar:
      name: ordenar
      in: query
      description: Campo de ordenação; prefixo "-" para ordem decrescente (por exemplo, -timestamp).
      schema:
        type: string
        pattern: '^-?[a-z_]+$'

  responses:
    ErroValidacao:
      description: Requisição inválida, com a lista de erros por campo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoAutenticado:
      description: Credencial ausente ou inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    SemPermissao:
      description: O papel não permite a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso não encontrado no inquilino.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Conflito:
      description: O recurso já existe ou está em estado incompatível.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  schemas:
    MensagemCanonica:
      $ref: './canonical-message.v1.schema.json'
    Lote:
      $ref: './batch.v1.schema.json'
    Erro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
          description: Código estável do erro, por exemplo validacao, nao_autenticado.
        mensagem:
          type: string
        detalhes:
          type: array
          items:
            $ref: '#/components/schemas/ErroCampo'
    ErroCampo:
      type: object
      required: [caminho, regra, mensagem]
      properties:
        caminho:
          type: string
          description: JSON Pointer do campo, por exemplo /medidas/0/unidade.
        regra:
          type: string
          description: Regra do JSON Schema que falhou.
        mensagem:
          type: string
    ResultadoValidacao:
      type: object
      required: [valido, erros]
      properties:
        valido:
          type: boolean
        erros:
          type: array
          items:
            $ref: '#/components/schemas/ErroCampo'
    ResultadoMensagem:
      type: object
      required: [indice, id_mensagem, resultado]
      properties:
        indice:
          type: integer
          minimum: 0
          description: Posição da mensagem no lote, base 0; em POST /ingestao vale 0 (ADR-012).
        id_mensagem:
          type: [string, 'null']
          format: uuid
          description: UUID da mensagem; null quando a mensagem recusada não trouxe id válido.
        resultado:
          type: string
          enum: [aceita, duplicada, recusada]
        erros:
          type: array
          items:
            $ref: '#/components/schemas/ErroCampo'
    ResultadoLote:
      type: object
      required: [id_lote, resultados]
      properties:
        id_lote:
          type: string
          format: uuid
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/ResultadoMensagem'
    Uuid:
      type: string
      format: uuid
    Slug:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
    Instante:
      type: string
      format: date-time
    GeometriaGeoJSON:
      $ref: './canonical-message.v1.schema.json#/$defs/geometria'
    Poligono:
      allOf:
        - $ref: '#/components/schemas/GeometriaGeoJSON'
        - type: object
          properties:
            type:
              const: Polygon
    Ponto:
      allOf:
        - $ref: '#/components/schemas/GeometriaGeoJSON'
        - type: object
          properties:
            type:
              const: Point
    NovoDominio:
      type: object
      required: [slug, nome]
      additionalProperties: false
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        nome:
          type: string
          minLength: 1
    AlteracaoDominio:
      type: object
      required: [nome]
      additionalProperties: false
      properties:
        nome:
          type: string
          minLength: 1
    Dominio:
      type: object
      required: [id, slug, nome, criado_em]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          $ref: '#/components/schemas/Slug'
        nome:
          type: string
        criado_em:
          $ref: '#/components/schemas/Instante'
    Grandeza:
      type: object
      required: [nome, unidade]
      additionalProperties: false
      properties:
        nome:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        unidade:
          type: string
          description: Código UCUM, sem espaço.
        faixa:
          type: object
          additionalProperties: false
          properties:
            min:
              type: number
            max:
              type: number
        expressao:
          type: string
          description: Grandeza derivada; aceita números, + - * /, parênteses, grandezas, atributos.* e min, max, abs.
    NovoPerfil:
      type: object
      required: [dominio_id, nome, intervalo_esperado_s, grandezas]
      additionalProperties: false
      properties:
        dominio_id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
          minLength: 1
        intervalo_esperado_s:
          type: integer
          minimum: 1
        grandezas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Grandeza'
    AlteracaoPerfil:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nome:
          type: string
          minLength: 1
        intervalo_esperado_s:
          type: integer
          minimum: 1
        grandezas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Grandeza'
    Perfil:
      type: object
      required: [id, dominio_id, nome, versao, intervalo_esperado_s, grandezas, criado_em]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        dominio_id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
        versao:
          type: integer
          minimum: 1
          description: Sobe a cada alteração das grandezas (RF-CEN-02).
        intervalo_esperado_s:
          type: integer
        grandezas:
          type: array
          items:
            $ref: '#/components/schemas/Grandeza'
        criado_em:
          $ref: '#/components/schemas/Instante'
    NovoSite:
      type: object
      required: [slug, nome]
      additionalProperties: false
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        nome:
          type: string
          minLength: 1
        geometria:
          $ref: '#/components/schemas/GeometriaGeoJSON'
    AlteracaoSite:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nome:
          type: string
          minLength: 1
        geometria:
          $ref: '#/components/schemas/GeometriaGeoJSON'
    Site:
      type: object
      required: [id, slug, nome, geometria, criado_em]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          $ref: '#/components/schemas/Slug'
        nome:
          type: string
        geometria:
          oneOf:
            - $ref: '#/components/schemas/GeometriaGeoJSON'
            - type: 'null'
        criado_em:
          $ref: '#/components/schemas/Instante'
    NovaArea:
      type: object
      required: [site_id, slug, nome, geometria]
      additionalProperties: false
      properties:
        site_id:
          $ref: '#/components/schemas/Uuid'
        slug:
          $ref: '#/components/schemas/Slug'
        nome:
          type: string
          minLength: 1
        geometria:
          $ref: '#/components/schemas/Poligono'
    AlteracaoArea:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nome:
          type: string
          minLength: 1
        geometria:
          $ref: '#/components/schemas/Poligono'
    Area:
      type: object
      required: [id, site_id, slug, nome, geometria, criado_em]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        site_id:
          $ref: '#/components/schemas/Uuid'
        slug:
          $ref: '#/components/schemas/Slug'
        nome:
          type: string
        geometria:
          $ref: '#/components/schemas/Poligono'
        criado_em:
          $ref: '#/components/schemas/Instante'
    EstadoDispositivo:
      type: string
      enum: [NUNCA_CONECTADO, ONLINE, SEM_SINAL]
      description: SEM_SINAL depois de 3 intervalos esperados do perfil sem contato (RF-DIS-06).
    NovoDispositivo:
      type: object
      required: [slug, perfil_id, site_id]
      additionalProperties: false
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        perfil_id:
          $ref: '#/components/schemas/Uuid'
        site_id:
          $ref: '#/components/schemas/Uuid'
        area_id:
          $ref: '#/components/schemas/Uuid'
        fabricante:
          type: string
        firmware:
          type: string
        atributos:
          type: object
          additionalProperties:
            type: number
        tags:
          type: array
          items:
            type: string
        localizacao:
          $ref: '#/components/schemas/Ponto'
        credencial_expira_em:
          $ref: '#/components/schemas/Instante'
    AlteracaoDispositivo:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        area_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        fabricante:
          type: string
        firmware:
          type: string
        atributos:
          type: object
          additionalProperties:
            type: number
        tags:
          type: array
          items:
            type: string
        localizacao:
          $ref: '#/components/schemas/Ponto'
    Dispositivo:
      type: object
      required:
        [
          id,
          slug,
          perfil_id,
          perfil_versao,
          dominio_id,
          site_id,
          area_id,
          fabricante,
          firmware,
          atributos,
          tags,
          localizacao,
          estado,
          ultimo_contato_em,
          credencial_expira_em,
          credencial_revogada_em,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          $ref: '#/components/schemas/Slug'
        perfil_id:
          $ref: '#/components/schemas/Uuid'
        perfil_versao:
          type: integer
          description: Versão do perfil no momento do cadastro.
        dominio_id:
          $ref: '#/components/schemas/Uuid'
        site_id:
          $ref: '#/components/schemas/Uuid'
        area_id:
          type: [string, 'null']
          format: uuid
        fabricante:
          type: [string, 'null']
        firmware:
          type: [string, 'null']
        atributos:
          type: object
          additionalProperties:
            type: number
        tags:
          type: array
          items:
            type: string
        localizacao:
          oneOf:
            - $ref: '#/components/schemas/Ponto'
            - type: 'null'
        estado:
          $ref: '#/components/schemas/EstadoDispositivo'
        ultimo_contato_em:
          type: [string, 'null']
          format: date-time
        credencial_expira_em:
          type: [string, 'null']
          format: date-time
        credencial_revogada_em:
          type: [string, 'null']
          format: date-time
    DispositivoCadastrado:
      allOf:
        - $ref: '#/components/schemas/Dispositivo'
        - type: object
          required: [credencial]
          properties:
            credencial:
              type: string
              pattern: '^[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}$'
              description: Token <id>.<segredo>, mostrado uma única vez; a plataforma guarda só o hash do segredo (ADR-014).
    PaginaDominios:
      allOf:
        - $ref: '#/components/schemas/PaginaGenerica'
        - type: object
          properties:
            itens:
              type: array
              items:
                $ref: '#/components/schemas/Dominio'
    PaginaPerfis:
      allOf:
        - $ref: '#/components/schemas/PaginaGenerica'
        - type: object
          properties:
            itens:
              type: array
              items:
                $ref: '#/components/schemas/Perfil'
    PaginaSites:
      allOf:
        - $ref: '#/components/schemas/PaginaGenerica'
        - type: object
          properties:
            itens:
              type: array
              items:
                $ref: '#/components/schemas/Site'
    PaginaAreas:
      allOf:
        - $ref: '#/components/schemas/PaginaGenerica'
        - type: object
          properties:
            itens:
              type: array
              items:
                $ref: '#/components/schemas/Area'
    PaginaDispositivos:
      allOf:
        - $ref: '#/components/schemas/PaginaGenerica'
        - type: object
          properties:
            itens:
              type: array
              items:
                $ref: '#/components/schemas/Dispositivo'
    UltimoValor:
      type: object
      required: [grandeza, valor, unidade, timestamp, atrasada, suspeita, derivada]
      properties:
        grandeza:
          type: string
        valor:
          type: number
        unidade:
          type: string
        timestamp:
          $ref: '#/components/schemas/Instante'
        atrasada:
          type: boolean
        suspeita:
          type: boolean
        derivada:
          type: boolean
    UltimoEstadoDispositivo:
      type: object
      required: [dispositivo_id, slug, estado, ultimo_contato_em, grandezas]
      properties:
        dispositivo_id:
          $ref: '#/components/schemas/Uuid'
        slug:
          $ref: '#/components/schemas/Slug'
        estado:
          $ref: '#/components/schemas/EstadoDispositivo'
        ultimo_contato_em:
          type: [string, 'null']
          format: date-time
        grandezas:
          type: array
          items:
            $ref: '#/components/schemas/UltimoValor'
    PaginaUltimoEstado:
      allOf:
        - $ref: '#/components/schemas/PaginaGenerica'
        - type: object
          properties:
            itens:
              type: array
              items:
                $ref: '#/components/schemas/UltimoEstadoDispositivo'
    PontoBruto:
      type: object
      required: [grandeza, timestamp, valor, unidade, suspeita, atrasada, derivada]
      properties:
        grandeza:
          type: string
        timestamp:
          $ref: '#/components/schemas/Instante'
        valor:
          type: number
        unidade:
          type: string
        suspeita:
          type: boolean
        atrasada:
          type: boolean
        derivada:
          type: boolean
    PontoAgregado:
      type: object
      required: [grandeza, inicio, media, minimo, maximo, quantidade]
      properties:
        grandeza:
          type: string
        inicio:
          $ref: '#/components/schemas/Instante'
        media:
          type: number
        minimo:
          type: number
        maximo:
          type: number
        quantidade:
          type: integer
          minimum: 1
    Pontos:
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/PontoBruto'
          - $ref: '#/components/schemas/PontoAgregado'
    Bucket:
      type: [string, 'null']
      enum: ['1m', '15m', '1h', null]
    SerieDispositivo:
      type: object
      required: [dispositivo_id, de, ate, bucket, pontos]
      properties:
        dispositivo_id:
          $ref: '#/components/schemas/Uuid'
        de:
          $ref: '#/components/schemas/Instante'
        ate:
          $ref: '#/components/schemas/Instante'
        bucket:
          $ref: '#/components/schemas/Bucket'
        pontos:
          $ref: '#/components/schemas/Pontos'
    SerieArea:
      type: object
      required: [area_id, de, ate, bucket, series]
      properties:
        area_id:
          $ref: '#/components/schemas/Uuid'
        de:
          $ref: '#/components/schemas/Instante'
        ate:
          $ref: '#/components/schemas/Instante'
        bucket:
          $ref: '#/components/schemas/Bucket'
        series:
          type: array
          items:
            type: object
            required: [dispositivo_id, slug, pontos]
            properties:
              dispositivo_id:
                $ref: '#/components/schemas/Uuid'
              slug:
                $ref: '#/components/schemas/Slug'
              pontos:
                $ref: '#/components/schemas/Pontos'
    PaginaGenerica:
      type: object
      required: [itens, pagina, limite, total]
      properties:
        itens:
          type: array
          items: {}
        pagina:
          type: integer
        limite:
          type: integer
        total:
          type: integer
