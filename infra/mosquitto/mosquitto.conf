# Broker MQTT central de desenvolvimento (ADR-002).
# Sem TLS e sem ACL nesta etapa: os dois entram na trilha T3 (RF-ING-01, RF-SEG-04).
persistence true
persistence_location /mosquitto/data/
# Grava a persistência a cada 60 s (o padrão é 1800 s), para uma queda do broker perder menos.
autosave_interval 60

# Fila por sessão de assinante (T1-vazão, ADR-017). O padrão (1.000 mensagens) descartava em
# silêncio as rajadas que o core-api ainda não tinha drenado. O limite real passa a ser em bytes:
# 512 MB por sessão; acima disso o broker ainda descarta, e o contador $SYS/.../dropped mostra.
max_queued_messages 0
max_queued_bytes 536870912
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/data/passwd
