# Broker MQTT central de desenvolvimento (ADR-002).
# Sem TLS e sem ACL nesta etapa: os dois entram na trilha T3 (RF-ING-01, RF-SEG-04).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/data/passwd
